services:
  vault:
    image: hashicorp/vault:1.21.4
    container_name: vault
    hostname: vault
    ports:
      - "8200:8200"
    networks:
      - sg-prod-zone-1
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    environment:
      VAULT_ADDR: http://vault:8200
      TZ: Asia/Jakarta
      VAULT_LOCAL_CONFIG: |
        {
          "storage": {
            "file": { "path": "/vault/file" }
          },
          "listener": [
            { "tcp": { "address": "vault:8200", "tls_disable": true } }
          ],
          "default_lease_ttl": "168h",
          "max_lease_ttl": "720h",
          "disable_mlock": true,
          "ui": true,
          "api_addr": "http://vault:8200"
        }
    command: server

volumes:
  vault_data:


networks:
  sg-prod-zone-1:
    external: true
