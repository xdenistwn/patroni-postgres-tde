services:
  haproxy-master:
    image: haproxy-keepalived:latest
    container_name: haproxy-master
    hostname: haproxy-master
    restart: unless-stopped
    cap_add:
      # Required by keepalived for VIP management (ARP, IP manipulation)
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    ports:
      # Stats UI (master)
      - "8404:8404"
      # --- Cluster 1: postgres-cluster ---
      - "5430:5432"   # ★ Unified single endpoint
      - "5001:5001"   # Read/Write (Primary only)
      - "5101:5101"   # Read-Only  (Replicas, with primary fallback)
    volumes:
      - ../haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./keepalived.conf:/etc/keepalived/keepalived.conf:ro
      - ../check_haproxy.sh:/usr/local/bin/check_haproxy.sh:ro
    networks:
      haproxy_ha:
        ipv4_address: 10.51.0.10
      region_singapore_net: {}
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  haproxy_ha:
    external: true
  region_singapore_net:
    external: true
