# ===========================================================================
# Keepalived Configuration — MASTER node
# ===========================================================================
# Priority 101 (higher than standby's 100) → this node owns the VIP first.
# If HAProxy fails the health check, priority drops and the VIP migrates.
# ===========================================================================

global_defs {
    router_id HAPROXY_MASTER
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/local/bin/check_haproxy.sh"
    interval 2        # check every 2 seconds
    weight -30        # drop priority by 30 on failure (101-30=71 < standby's 100)
    fall 3            # mark failed after 3 consecutive failures
    rise 2            # mark recovered after 2 consecutive successes
}

vrrp_instance HAPROXY_VIP {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101

    advert_int 1

    authentication {
        auth_type PASS
        auth_pass haproxy_ha
    }

    track_script {
        chk_haproxy
    }

    # VIP address — this is the address Laravel connects to
    virtual_ipaddress {
        10.51.0.100/24
    }
}
