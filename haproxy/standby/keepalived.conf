# ===========================================================================
# Keepalived Configuration — STANDBY (BACKUP) node
# ===========================================================================
# Priority 100 (lower than master's 101) → this node only takes the VIP
# when the master's HAProxy fails and keepalived lowers its priority.
# ===========================================================================

global_defs {
    router_id HAPROXY_STANDBY
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/local/bin/check_haproxy.sh"
    interval 2        # check every 2 seconds
    weight -30        # drop priority by 30 on failure (100-30=70)
    fall 3            # mark failed after 3 consecutive failures
    rise 2            # mark recovered after 2 consecutive successes
}

vrrp_instance HAPROXY_VIP {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100

    advert_int 1

    authentication {
        auth_type PASS
        auth_pass haproxy_ha
    }

    track_script {
        chk_haproxy
    }

    # VIP address — same as master; only one node holds it at a time
    virtual_ipaddress {
        10.51.0.100/24
    }
}
