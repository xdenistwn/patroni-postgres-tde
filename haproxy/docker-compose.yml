services:
  haproxy:
    image: haproxy:3.1-alpine
    container_name: haproxy
    hostname: haproxy
    restart: unless-stopped
    ports:
      # Stats UI
      - "8404:8404"
      # --- Cluster 1: postgres-cluster ---
      - "5001:5001"   # Read/Write (Primary)
      - "5101:5101"   # Read-Only  (Replicas)
      # --- Cluster 2: tenant-alpha-cluster (uncomment when ready) ---
      # - "5002:5002"
      # - "5102:5102"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - pg_network
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pg_network:
    external: true
