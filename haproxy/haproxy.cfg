#---------------------------------------------------------------------
# HAProxy Configuration for Multi-Tenant Patroni PostgreSQL Clusters
#---------------------------------------------------------------------
# Architecture (HA with Keepalived):
#
#                       VIP: 10.51.0.100
#                            │
#               ┌────────────┴────────────┐
#               │                         │
#        ┌──────┴──────┐          ┌───────┴──────┐
#        │  haproxy    │          │  haproxy     │
#        │  master     │  VRRP   │  standby     │
#        │  pri: 101   │◄───────►│  pri: 100    │
#        │  10.51.0.10 │         │  10.51.0.11  │
#        └──────┬──────┘         └───────┬──────┘
#               │                        │
#               └────────────┬───────────┘
#                            │
#         ┌──────────────────┼──────────────────┐
#         │ PgBouncer :6432  │ PgBouncer :6432  │
#         │  postgres-one    │  postgres-two    │
#         └──────────────────┴──────────────────┘
#
#   Laravel App → VIP (10.51.0.100) → Active HAProxy → PgBouncer → PostgreSQL
#
# Port Scheme per Cluster:
#   Read/Write (Primary):  5000 + cluster_index  (e.g. 5001, 5002, 5003)
#   Read-Only  (Replica):  5100 + cluster_index  (e.g. 5101, 5102, 5103)
#
# Postgres Patroni REST API Health Checks:
#   GET /primary   → 200 if node is the current leader
#   GET /replica   → 200 if node is a running replica
#   GET /health    → 200 if node is running (any role)
#---------------------------------------------------------------------

global
    maxconn 4096
    log stdout format raw local0
    stats socket /tmp/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    mode tcp
    log global
    retries 3
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 5s

#---------------------------------------------------------------------
# Stats / Monitoring UI
#---------------------------------------------------------------------
listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth admin:admin
    stats admin if TRUE

# ---------------------------------------------------------------------------
# Port 5001 — Writes only (Primary only)
# Health check: GET /primary → Patroni returns 200 only on the current leader
# on-marked-down shutdown-sessions: immediately drops active sessions on failure
# ---------------------------------------------------------------------------
frontend pg_cluster1_writes
    bind *:5001
    mode tcp
    default_backend pg_cluster1_primary

# ---------------------------------------------------------------------------
# Port 5101 — Reads (Replica-preferred, fallback to Primary)
#
# Problem solved: with only 2 nodes, failover leaves ZERO replicas temporarily.
# HAProxy activates `pg_cluster1_primary` automatically when
# nbsrv(pg_cluster1_replicas) == 0 (no healthy replica backends).
# ---------------------------------------------------------------------------
frontend pg_cluster1_reads
    bind *:5101
    mode tcp
    # Route to replicas if at least 1 is healthy; otherwise fall back to primary
    use_backend pg_cluster1_replicas if { nbsrv(pg_cluster1_replicas) ge 1 }
    default_backend pg_cluster1_primary

# ---------------------------------------------------------------------------
# Shared backends — referenced by both frontends above
# ---------------------------------------------------------------------------

# Replica backend — only nodes passing GET /replica are active
backend pg_cluster1_replicas
    mode tcp
    balance roundrobin
    option httpchk
    http-check send meth HEAD uri /replica ver HTTP/1.1
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 maxconn 500

    server postgres-one postgres-one:6432 check port 8008
    server postgres-two postgres-two:6432 check port 8008

# Primary backend — routes to the current Patroni leader
# Used by: port 5001 (writes), port 5101 (read fallback)
backend pg_cluster1_primary
    mode tcp
    option httpchk
    http-check send meth HEAD uri /primary ver HTTP/1.1
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 on-marked-down shutdown-sessions maxconn 500

    server postgres-one postgres-one:6432 check port 8008
    server postgres-two postgres-two:6432 check port 8008


