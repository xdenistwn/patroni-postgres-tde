scope: postgres-restore
namespace: /db/
name: postgres-restore

restapi:
  listen: 0.0.0.0:8008
  connect_address: postgres-restore:8008

etcd3:
  hosts:
  - etcd1:2379
  - etcd2:2379
  - etcd3:2379
  protocol: https
  cacert: /etc/postgres/certs/ca.crt
  cert: /etc/postgres/certs/public.crt
  key: /etc/postgres/certs/private.key

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        # PostgreSQL Configuration
        max_connections: 100
        shared_buffers: 256MB
        effective_cache_size: 1GB
        maintenance_work_mem: 64MB
        checkpoint_completion_target: 0.9
        wal_buffers: 16MB
        default_statistics_target: 100
        random_page_cost: 1.1
        effective_io_concurrency: 200
        work_mem: 2621kB
        min_wal_size: 1GB
        max_wal_size: 4GB
        shared_preload_libraries: "pg_tde, pg_partman_bgw, pg_stat_monitor, pg_cron, pgaudit"
      
        # Replication Settings
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 1GB
        wal_log_hints: "on"
      
        # Logging
        logging_collector: "on"
        log_directory: "log"
        log_filename: "postgresql-%Y-%m-%d_%H%M%S.log"
        log_rotation_age: 1d
        log_rotation_size: 100MB
        log_line_prefix: "%m [%p] %u@%d "
        log_timezone: "Asia/Jakarta"
        # logging pg_aduit
        pgaudit.log: 'all'
        pgaudit.log_catalog: off
        pgaudit.log_client: off
        pgaudit.log_level: 'log'
      
        # pg_tde
        pg_tde.wal_encrypt: "off"
        default_table_access_method: "tde_heap"
      
        # Archive mode MUST be off to prevent writing to the primary archive!
        archive_mode: "off"
  
  # Custom bootstrap method via pgbackrest
  method: pgbackrest
  pgbackrest:
    command: "/bin/bash -c \"pgbackrest --stanza=postgres-archive-dev-cluster-1 --type=time --target='2026-03-29 22:24:59.520559+07' --target-timeline='current' --target-action=promote restore\""
    keep_existing_recovery_conf: true

postgresql:
  listen: 0.0.0.0:5432
  connect_address: postgres-restore:5432
  data_dir: /data/db
  bin_dir: /usr/pgsql-18/bin
  pgpass: /tmp/pgpass
  
  authentication:
    replication:
      username: ${PATRONI_REPLICATION_USERNAME}
      password: ${PATRONI_REPLICATION_PASSWORD}
    superuser:
      username: ${PATRONI_SUPERUSER_USERNAME}
      password: ${PATRONI_SUPERUSER_PASSWORD}
  
  parameters:
    unix_socket_directories: "/var/run/postgresql"
  
  create_replica_methods:
    - tde_basebackup
  
  tde_basebackup:
    command: "/usr/local/bin/patroni-tde-basebackup.sh"
    checkpoint: fast
    max-rate: 100M

  # recovery_conf to fetch necessary WAL files until target time
  recovery_conf:
    restore_command: 'pgbackrest --stanza=postgres-patroni-tde archive-get %f "%p"'

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
