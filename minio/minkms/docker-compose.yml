services:
  minkms:
    image: quay.io/minio/aistor/minkms:latest
    container_name: minkms
    hostname: minkms
    # MinKMS uses HashiCorp Vault transit engine to wrap/unwrap its root seal key.
    # Vault must be running and unsealed before starting MinKMS.
    external_links:
      - vault
    networks:
      - pg_network
    ports:
      - "7373:7373"
    volumes:
      - minkms_data:/mnt/minio-kms
      - ./certs:/etc/minkms/certs
      - ./config.yaml:/etc/minkms/config.yaml
    environment:
      - TZ=Asia/Jakarta
      - MINIO_KMS_VOLUME=/mnt/minio-kms
    command: ["server", "--config", "/etc/minkms/config.yaml", "/mnt/minio-kms"]

volumes:
  minkms_data:

networks:
  pg_network:
    external: true