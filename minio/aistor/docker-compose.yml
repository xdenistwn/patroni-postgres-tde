# docker run -dt                                             \
#   -p 9000:9000 -p 9001:9001                                \
#   -v $HOME/minio/data:/mnt/data                            \
#   -v $HOME/minio/minio.license:/minio.license              \
#   -v $HOME/minio/certs:/etc/minio/certs                    \
#   --name "aistor-server"                                   \
#   quay.io/minio/aistor/minio:latest minio server /mnt/data \
#   --license /minio.license

services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    hostname: minio
    networks:
      - sg-prod-zone-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/mnt/data
      - ./certs:/root/.minio/certs
      - ./license/minio.license:/minio.license
    environment:
      - MINIO_KMS_SERVER=${MINIO_KMS_SERVER}
      - MINIO_KMS_API_KEY=${MINIO_KMS_API_KEY}
      - MINIO_KMS_SSE_KEY=${MINIO_KMS_SSE_KEY}
      - MINIO_KMS_ENCLAVE=${MINIO_KMS_ENCLAVE}
      - TZ=Asia/Jakarta
    command: [ "server", "/mnt/data", "--license", "/minio.license" ]
    healthcheck:
      test: [ "CMD", "curl", "-fk", "https://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data:


networks:
  sg-prod-zone-1:
    external: true
